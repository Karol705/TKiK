[project]
name = "rust-state-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ply>=3.11",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/parser", "src/analyzer", "src/visualization"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]